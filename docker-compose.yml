services:
  db:
    # TimescaleDB is PostgreSQL 16 plus the time-series extension.
    # Adopted now so we don't have to migrate the database later,
    # even though nothing uses the extension until Phase 3.
    image: timescale/timescaledb:latest-pg16
    container_name: nsp-db
    restart: unless-stopped
    environment:
      # Read by the Postgres entrypoint on FIRST start only,
      # to create the user and database.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to 127.0.0.1 deliberately: reachable from this machine but
      # NOT from other devices on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume so data survives 'docker compose down'.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready succeeds only once Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Only for the "clone and run" path; in development you run uvicorn
    # directly in the venv instead.
    build: .
    container_name: nsp-api
    restart: unless-stopped
    depends_on:
      db:
        # Wait for the healthcheck to pass, not merely for the container
        # to exist. 'depends_on' alone does not wait for readiness.
        condition: service_healthy
    environment:
      # Host is 'db', not 'localhost' — inside a Compose network each
      # service is reachable by its service name.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  db_data:

